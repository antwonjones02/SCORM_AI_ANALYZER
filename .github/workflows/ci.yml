name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install pytest playwright anthropic requests openpyxl \
                      fastapi 'uvicorn[standard]' python-multipart httpx
          playwright install chromium --with-deps

      - name: Rebuild test fixtures
        run: python tests/fixtures/build_fixtures.py

      - name: Run tests (unit + browser integration)
        run: pytest tests/ -v
